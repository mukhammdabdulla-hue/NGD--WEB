# Yangi saytni (web/) GitHub Pages'ga chiqaradi. Faqat statik frontend: backend va admin bu yerga kirmaydi.
# Ishlashi uchun: Settings -> Pages -> Source: "GitHub Actions".
name: Sayt (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Saytni yig'ish
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: node build.mjs
      - name: Yangi sayt (/proto/)
        working-directory: web
        env:
          SITE_OUT: dist/proto
          NOINDEX: '1'
          BASE_PATH: /${{ github.event.repository.name }}/proto/
        run: |
          npm ci
          node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
